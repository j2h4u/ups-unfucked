[project]
name = "ups-unfucked"
version = "1.1.0"
description = "Datacenter-grade battery telemetry for your $30 UPS. SoH, SoC, runtime prediction, self-calibration — everything the firmware gets wrong, unfucked."
requires-python = ">=3.13"
dependencies = [
    "python-systemd",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "pyright", "ruff", "vulture", "pytest-cov"]

[project.scripts]
ups-battery-monitor = "src.monitor:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E4/E7/E9: essential pycodestyle; F: pyflakes (real bugs); I: import order
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    "E402",   # module-level imports not at top (monitor_config.py has intentional late imports)
]

[tool.pyright]
include = ["src", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.ruff.format]
quote-style = "double"

[tool.vulture]
# vulture_whitelist.py lists reviewed false positives / intentionally-kept symbols.
paths = ["src", "vulture_whitelist.py"]
min_confidence = 60
# Signature-required params flagged as unused (e.g. signal-handler `frame`).
ignore_names = ["frame"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
# Exclude lines that are intentionally not exercised by tests.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "def main\\(",
]
