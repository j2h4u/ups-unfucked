name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Format, lint, type-check, dead-code — single Python version (these don't vary by runtime).
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run pyright
      - name: Dead-code (vulture, whitelist-gated)
        run: uv run vulture

  # Tests + coverage gate, across supported Python versions.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Tests with coverage
        run: uv run pytest --cov=src --cov-fail-under=80
