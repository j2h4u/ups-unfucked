name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Format, lint, architecture, and type checks — single Python version.
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Format check
        run: uv run ruff format --check src tests scripts
      - name: Lint and structural complexity
        run: uv run ruff check src tests scripts
      - name: Complexity suppression policy
        run: uv run python scripts/check_complexity_suppressions.py
      - name: Source-span budget
        run: uv run python scripts/check_source_spans.py
      - name: Architecture boundaries
        run: |
          uv run lint-imports
          uv run tach check
          uv run tach check --exact
      - name: Type check
        run: uv run pyright
      - name: Dead-code check
        run: uv run vulture
  # Tests + CRAP gate, across supported Python versions.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Tests with CRAP score
        run: |
          uv run pytest --cov=src --crap --crap-threshold=30
          uv run python scripts/check_crap.py --threshold 30
