# Normative dependency map for the final module layout.
#
# ``src.ema_filter`` is pure filtering math and therefore belongs with
# ``src.battery_math``.
source_roots = ["."]
layers = ["composition", "adapters", "application", "domain", "battery_math"]
layers_explicit_depends_on = true
exact = true

[[modules]]
path = "src.monitor"
depends_on = [
    "src.adapters.jsonl_event_store",
    "src.adapters.model_owner",
    "src.adapters.nut_telemetry",
    "src.alerter",
    "src.application",
    "src.domain",
    "src.ema_filter",
    "src.monitor_config",
    "src.nut_client",
    "src.virtual_ups_exporter",
]
layer = "composition"

[[modules]]
path = "src.telemetry_capability_cli"
depends_on = ["src.adapters.telemetry_capability_baseline", "src.monitor_config", "src.nut_client"]
layer = "composition"

[[modules]]
path = "src.monitor_config"
depends_on = ["src.battery_math", "src.domain"]
layer = "composition"

[[modules]]
path = "src.ema_filter"
depends_on = []
layer = "battery_math"

[[modules]]
path = "src.adapters"
depends_on = ["src.adapters.jsonl_index_merge", "src.adapters.jsonl_event_catalog", "src.adapters.jsonl_filesystem", "src.adapters.jsonl_index_metadata", "src.adapters.jsonl_errors", "src.adapters.jsonl_record_codec", "src.application"]
layer = "adapters"

[[modules]]
path = "src.adapters.jsonl_errors"
depends_on = ["src.application"]
layer = "adapters"

[[modules]]
path = "src.adapters.jsonl_event_store"
depends_on = [
    "src.adapters.jsonl_errors",
    "src.adapters.jsonl_event_catalog",
    "src.adapters.jsonl_event_stream",
    "src.adapters.jsonl_filesystem",
    "src.adapters.jsonl_health_report",
    "src.adapters.jsonl_index",
    "src.adapters.jsonl_record_codec",
    "src.adapters.jsonl_work_registry",
    "src.application",
    "src.domain", "src.adapters",
]
layer = "adapters"

[[modules]]
